# Local development only. §21: production is a single small VM running
# Compose with the same shape (Caddy -> app -> worker, managed Postgres
# external to the VM) — this file swaps managed Postgres for a local
# container and drops Caddy/TLS, which local dev doesn't need.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiagentv8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_roles.sql:/docker-entrypoint-initdb.d/01_create_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "app.jobs.worker"]
    env_file: .env
    volumes:
      - ./app:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
